name: app-build-android-only

on:
  workflow_dispatch:  # 手动触发
  push:
    tags:
      - "dev_v*"    # 打 dev_v* 标签自动触发

jobs:
  build-android:
    runs-on: ubuntu-latest  # 用 Ubuntu 避免 macOS Git 问题
    permissions:
      contents: read

    steps:
      # 1. 强制用 HTTPS 拉取 dev 分支，彻底绕开 SSH 和通配符
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 1
          submodules: false
          fetch-tags: false
          persist-credentials: false  # 强制用 HTTPS

      # 2. 下载并还原 Android 签名密钥（你之前那 4 个 Secrets 在这里生效）
      - name: Download Android keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: keystore.jks
          encodedString: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > simple_live_app/android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> simple_live_app/android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> simple_live_app/android/key.properties

      # 3. 配置 Java 环境
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"

      # 4. 配置 Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true

      # 5. 拉取依赖
      - name: Install dependencies
        run: |
          cd simple_live_app
          flutter pub get

      # 6. 只编译 Android Release APK
      - name: Build Android APK
        run: |
          cd simple_live_app
          flutter build apk --release --split-per-abi

      # 7. 上传编译好的 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
